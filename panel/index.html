<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#212120">
  <title>Panel de respuestas · Cena Dotanova × Neotek</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&family=Fjalla+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/panel/panel.css">
  <script src="/panel/panel.js" defer></script>
</head>
<body>
  <header class="cabecera">
    <div class="cabecera-titulo">
      <p class="marca">Cena Dotanova × Neotek · 24 de noviembre</p>
      <h1>Respuestas</h1>
      <p class="actualizado" id="actualizado" aria-live="polite">Cargando…</p>
    </div>
    <div class="acciones">
      <button class="boton" type="button" id="actualizar">Actualizar</button>
      <label class="interruptor">
        <input type="checkbox" id="mostrar-pruebas">
        <span class="interruptor-pista" aria-hidden="true"></span>
        <span>Mostrar pruebas</span>
      </label>
      <a class="boton boton-secundario" href="/api/confirmaciones.csv">Descargar lista (CSV)</a>
      <a class="boton boton-secundario" href="/api/confirmaciones-todas.csv">Descargar auditoría (CSV)</a>
      <form method="post" action="/panel/salir" class="salir">
        <button class="boton boton-secundario" type="submit">Salir</button>
      </form>
    </div>
  </header>

  <main class="contenido">
    <p class="aviso" id="aviso" role="status" hidden></p>

    <section aria-labelledby="titulo-cifras">
      <h2 id="titulo-cifras" class="sr-only">Cifras</h2>
      <div class="cifras" id="cifras"></div>
    </section>

    <section class="bloque" aria-labelledby="titulo-dias">
      <h2 id="titulo-dias">Respuestas por día</h2>
      <div class="dias" id="dias"></div>
      <p class="leyenda"><span class="muestra muestra-confirmado"></span>Confirmado <span class="muestra muestra-declino"></span>Declinó</p>
    </section>

    <section class="bloque" aria-labelledby="titulo-alergias">
      <h2 id="titulo-alergias">Alergias, para el restaurante</h2>
      <div id="alergias"></div>
    </section>

    <section class="bloque" aria-labelledby="titulo-coordinar">
      <h2 id="titulo-coordinar">Quieren coordinar otro espacio</h2>
      <div id="coordinar"></div>
    </section>

    <section class="bloque" aria-labelledby="titulo-todas">
      <h2 id="titulo-todas">Todas las respuestas</h2>
      <div class="filtros">
        <label class="filtro filtro-buscar">
          <span>Buscar</span>
          <input type="search" id="buscar" placeholder="Nombre, empresa, correo, id…" autocomplete="off">
        </label>
        <label class="filtro">
          <span>Respuesta</span>
          <select id="filtro-respuesta">
            <option value="">Todas</option>
            <option value="Confirmado">Confirmado</option>
            <option value="Declinó">Declinó</option>
          </select>
        </label>
        <label class="filtro">
          <span>Versión</span>
          <select id="filtro-version">
            <option value="">Todas</option>
            <option value="Actual">Actual</option>
            <option value="Potencial">Potencial</option>
          </select>
        </label>
      </div>
      <p class="conteo" id="conteo" aria-live="polite"></p>
      <div id="todas"></div>
    </section>
  </main>
</body>
</html>

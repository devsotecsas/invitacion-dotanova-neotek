<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#212120">
  <title>Panel de respuestas · Acceso</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&family=Fjalla+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/panel/panel.css">
</head>
<body class="acceso">
  <main class="acceso-caja">
    <p class="marca">Dotanova × Neotek</p>
    <h1>Panel de respuestas</h1>
    <form method="post" action="/panel/entrar" class="acceso-form">
      <!-- para los gestores de contraseñas; el servidor solo usa la clave -->
      <input type="text" name="usuario" value="panel" autocomplete="username" hidden>
      <label for="clave">Clave</label>
      <input id="clave" name="clave" type="password" autocomplete="current-password" required autofocus>
      <!--ERROR-->
      <button class="boton" type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
